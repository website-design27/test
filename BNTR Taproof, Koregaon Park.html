<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BNTR Taproof | Rooftop Bar, Restaurant &amp; Beer Garden in Koregaon Park, Pune</title>
<meta name="description" content="BNTR Taproof is a rooftop bar, restaurant and beer garden in Koregaon Park, Pune. Craft beer, cocktails, bar food and open-air views. Reserve a table.">
<meta property="og:title" content="BNTR Taproof, Koregaon Park, Pune">
<meta property="og:description" content="Rooftop bar, restaurant and beer garden with craft beer, cocktails and bar food.">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍺%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{colors:{ink:'#0a0a0b',char:'#161618',slate2:'#222226',gold:'#c9a24b',amber2:'#d98a2b',bone:'#ece6d8'},fontFamily:{display:['Fraunces','Georgia','serif'],sans:['Outfit','system-ui','sans-serif']}}}}
</script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:5rem}
body{background:#0a0a0b;color:#ece6d8;font-family:Outfit,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0a0a0b;z-index:60}
:focus-visible{outline:2px solid #c9a24b;outline-offset:3px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.glow{animation:glow 6s ease-in-out infinite}
.bulb{animation:twinkle 3.2s ease-in-out infinite}
.hero-in>*{opacity:0;animation:rise 1s ease forwards}
.hero-in>*:nth-child(2){animation-delay:.2s}.hero-in>*:nth-child(3){animation-delay:.4s}.hero-in>*:nth-child(4){animation-delay:.6s}
.ph{background:radial-gradient(120% 90% at 20% 10%,var(--a,#3a2a12),transparent 60%),linear-gradient(160deg,#1d1d21,#0d0d0f)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.hero-in>*{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:2rem">BNTR Taproof, Power Plaza Rooftop, Lane 7, Koregaon Park, Pune. Please enable JavaScript to view the full site.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const LR=window.LucideReact||{};
const I=(n)=>LR[n]||(()=>null);
const {Menu,X,MapPin,Clock,Phone,Mail,Star,Instagram,Facebook,Beer,Martini,Utensils,Music,Sun,ChevronLeft,ChevronRight,Calendar,Users,Navigation,Quote,Check,Maximize2}=Object.fromEntries(['Menu','X','MapPin','Clock','Phone','Mail','Star','Instagram','Facebook','Beer','Martini','Utensils','Music','Sun','ChevronLeft','ChevronRight','Calendar','Users','Navigation','Quote','Check','Maximize2'].map(n=>[n,I(n)]));

/* ---------- Content: replace every PLACEHOLDER before launch ---------- */
const BIZ={
  name:'BNTR Taproof',
  address:'Power Plaza Rooftop, Lane 7, above Soy Como Soy, Koregaon Park, Pune',
  pincode:'[PLACEHOLDER: PIN code]',
  phone:'[PLACEHOLDER: phone number]',
  email:'[PLACEHOLDER: email address]',
  instagram:'#', facebook:'#',  // PLACEHOLDER: add official profile URLs
  rating:'4.5', ratingCount:'about 188', // From public Google listing; confirm before launch
  mapQ:'BNTR Taproof Koregaon Park Pune',
  hours:[['Monday to Thursday','3 PM to 12 AM'],['Friday to Sunday','12 PM to 12 AM']] // From public listings; confirm
};
const NAV=[['about','About'],['menu','Food & Drinks'],['beer','Craft Beer'],['cocktails','Cocktails'],['gallery','Gallery'],['experiences','Experiences'],['contact','Contact']];
const MENU={
 Starters:[['Chicken wing 65','Mentioned in guest reviews. Description to be confirmed.','₹ XXX'],['Starter name placeholder','Short description placeholder.','₹ XXX'],['Starter name placeholder','Short description placeholder.','₹ XXX']],
 'Bar bites':[['Bar bite placeholder','Short description placeholder.','₹ XXX'],['Bar bite placeholder','Short description placeholder.','₹ XXX'],['Bar bite placeholder','Short description placeholder.','₹ XXX']],
 Mains:[['Andhra chicken','Mentioned in guest reviews. Description to be confirmed.','₹ XXX'],['Main course placeholder','Short description placeholder.','₹ XXX'],['Vegetarian main placeholder','Short description placeholder.','₹ XXX']],
 Desserts:[['Dessert placeholder','Short description placeholder.','₹ XXX'],['Dessert placeholder','Short description placeholder.','₹ XXX']]
};
const BEERS=[['Beer on tap placeholder','Style, ABV and tasting notes to come.','₹ XXX'],['Beer on tap placeholder','Style, ABV and tasting notes to come.','₹ XXX'],['Beer on tap placeholder','Style, ABV and tasting notes to come.','₹ XXX'],['Bottled or guest beer placeholder','Style, ABV and tasting notes to come.','₹ XXX']];
const COCKTAILS=[['Signature cocktail placeholder','Ingredients and story to come.','₹ XXX','#5a3a10'],['Signature cocktail placeholder','Ingredients and story to come.','₹ XXX','#4a2a0c'],['Signature cocktail placeholder','Ingredients and story to come.','₹ XXX','#3d3010']];
const GALLERY=[['Rooftop at dusk','#6b4a14','sm:col-span-2 sm:row-span-2'],['City views','#3f3a22',''],['Beer garden','#3a4a22',''],['The bar','#5a3010',''],['Live music and DJ nights','#4a1f12','sm:col-span-2'],['Dining','#4a3a14','']];
const EXPS=[[Sun,'Open-air rooftop','Sunset and skyline seating. Details to be confirmed.'],[Music,'Music and nights','Music programme placeholder. Add event calendar.'],[Utensils,'Group dining','Group and celebration options placeholder.'],[Martini,'Private bookings','Private event enquiry details placeholder.']];
const REVIEWS=[['Guest review placeholder. Add a real, permission-cleared review about the ambience here.','Guest name'],['Guest review placeholder. Add a real review about food or cocktails here.','Guest name'],['Guest review placeholder. Add a real review about service here.','Guest name']];

/* ---------- Hooks and primitives ---------- */
function useReveal(){const r=useRef(null);useEffect(()=>{const el=r.current;if(!el)return;if(!('IntersectionObserver'in window)){el.classList.add('in');return}const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add('in');o.disconnect()}},{threshold:.12});o.observe(el);return()=>o.disconnect()},[]);return r}
const Reveal=({children,className=''})=>{const r=useReveal();return <div ref={r} className={'rv '+className}>{children}</div>};
const Section=({id,title,intro,children,alt})=>(
  <section id={id} aria-labelledby={id+'-h'} className={'py-20 sm:py-28 '+(alt?'bg-char':'')}>
    <div className="mx-auto max-w-6xl px-5 sm:px-8">
      <Reveal className="max-w-2xl mb-12"><h2 id={id+'-h'} className="font-display text-4xl sm:text-5xl font-light leading-tight text-bone">{title}</h2>{intro&&<p className="mt-4 text-bone/70 leading-relaxed">{intro}</p>}</Reveal>
      {children}
    </div>
  </section>);
const Btn=({href,children,variant='gold',...p})=>(
  <a href={href} {...p} className={'inline-flex items-center justify-center gap-2 rounded-full px-7 py-3.5 text-sm font-medium tracking-wide transition duration-300 '+(variant==='gold'?'bg-gold text-ink hover:bg-amber2 hover:shadow-[0_0_30px_rgba(217,138,43,.35)]':'border border-gold/50 text-bone hover:border-gold hover:bg-gold/10')}>{children}</a>);
const Ph=({children})=><span className="text-gold/80">{children}</span>;

/* ---------- Header ---------- */
function Header(){
  const [open,setOpen]=useState(false);const [solid,setSolid]=useState(false);
  useEffect(()=>{const f=()=>setSolid(window.scrollY>40);f();window.addEventListener('scroll',f,{passive:true});return()=>window.removeEventListener('scroll',f)},[]);
  return(<header className={'fixed inset-x-0 top-0 z-50 transition duration-500 '+(solid||open?'bg-ink/90 backdrop-blur border-b border-gold/15':'')} style={{paddingTop:'env(safe-area-inset-top,0px)'}}>
    <nav aria-label="Primary" className="mx-auto flex h-16 max-w-6xl items-center justify-between px-5 sm:px-8">
      <a href="#top" className="font-display text-xl tracking-wide text-bone">BNTR <span className="text-gold">Taproof</span></a>
      <ul className="hidden lg:flex items-center gap-7 text-sm text-bone/80">{NAV.map(([id,l])=><li key={id}><a href={'#'+id} className="transition hover:text-gold">{l}</a></li>)}</ul>
      <div className="flex items-center gap-3"><a href="#reserve" className="hidden sm:inline-flex rounded-full bg-gold px-5 py-2 text-sm font-medium text-ink transition hover:bg-amber2">Reserve a Table</a>
        <button className="lg:hidden p-2 text-bone" aria-expanded={open} aria-controls="mnav" aria-label={open?'Close menu':'Open menu'} onClick={()=>setOpen(!open)}>{open?<X size={24}/>:<Menu size={24}/>}</button></div>
    </nav>
    {open&&<ul id="mnav" className="lg:hidden border-t border-gold/10 px-5 pb-6 pt-2 text-lg">{NAV.concat([['reserve','Reserve a Table']]).map(([id,l])=><li key={id}><a onClick={()=>setOpen(false)} href={'#'+id} className="block py-3 text-bone/90 border-b border-white/5">{l}</a></li>)}</ul>}
  </header>)}

/* ---------- Hero ---------- */
function Hero(){
  const bulbs=Array.from({length:16},(_,i)=>i);
  return(<section id="top" className="relative flex min-h-[100svh] items-end overflow-hidden bg-ink" aria-labelledby="hero-h">
    <div className="absolute inset-0" aria-hidden="true">
      <div className="absolute inset-0" style={{background:'linear-gradient(180deg,#0a0a0b 0%,#1a1208 38%,#5a3510 68%,#d98a2b 100%)'}}/>
      <div className="glow absolute left-1/2 bottom-[18%] h-[60vmin] w-[60vmin] -translate-x-1/2 rounded-full" style={{background:'radial-gradient(circle,rgba(255,190,90,.55),rgba(217,138,43,.15) 45%,transparent 70%)'}}/>
      <svg className="absolute inset-x-0 bottom-0 w-full" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice"><path fill="#0f0d0a" d="M0 260V170h40v-30h50v50h40v-70h60v60h40v-40h70v80h50v-100h60v70h50v-50h60v90h40v-60h70v40h60v-80h50v70h60v-40h70v60h50v-30h60v60h40v-50h60V260z"/><path fill="#0a0a0b" d="M0 260v-60h80v-20h70v30h90v-40h60v50h100v-30h80v40h120v-60h70v50h110v-30h90v50h130v-20h100v50h100z"/>
        {[60,180,300,420,540,660,780,900,1020,1140].map((x,i)=><rect key={x} x={x} y={150+(i%3)*14} width="6" height="8" fill="#ffc46b" opacity=".6"/>)}
      </svg>
      <div className="absolute inset-x-0 top-20 flex justify-between px-2" >{bulbs.map(i=><span key={i} className="bulb h-1.5 w-1.5 rounded-full bg-gold" style={{animationDelay:(i*.23)+'s',marginTop:Math.sin(i/2.4)*10+'px'}}/>)}</div>
      <div className="absolute inset-0 bg-gradient-to-t from-ink/70 via-transparent to-ink/40"/>
    </div>
    <div className="hero-in relative mx-auto w-full max-w-6xl px-5 pb-20 pt-40 sm:px-8 sm:pb-28">
      <p className="text-sm text-gold">Koregaon Park, Pune</p>
      <h1 id="hero-h" className="mt-4 max-w-3xl font-display text-5xl font-light leading-[1.05] text-bone sm:text-7xl">Above the city, <br className="hidden sm:block"/>after dark.</h1>
      <p className="mt-6 max-w-xl text-lg leading-relaxed text-bone/80">Craft beer, cocktails and bar food on an open-air rooftop in the middle of Koregaon Park.</p>
      <div className="mt-9 flex flex-wrap gap-4"><Btn href="#reserve">Reserve a Table</Btn><Btn href="#menu" variant="ghost">View the menu</Btn></div>
    </div>
  </section>)}

/* ---------- Sections ---------- */
function Rating(){return(<div className="inline-flex items-center gap-4 rounded-2xl border border-gold/25 bg-char px-5 py-4" role="img" aria-label={'Google rating '+BIZ.rating+' out of 5'}>
  <span className="font-display text-4xl text-gold">{BIZ.rating}</span>
  <div><div className="flex gap-0.5 text-gold">{[0,1,2,3,4].map(i=><Star key={i} size={16} fill="currentColor"/>)}</div><p className="mt-1 text-xs text-bone/60">Google, {BIZ.ratingCount} ratings</p></div></div>)}

function About(){return(<Section id="about" title="A rooftop with room to linger" intro="BNTR Taproof is a rooftop bar, restaurant and beer garden above Soy Como Soy in Koregaon Park. Guests come for the views, the music and the service, and stay for the drinks.">
  <div className="grid items-center gap-10 md:grid-cols-2">
    <Reveal><div className="ph aspect-[4/3] rounded-3xl border border-gold/15 flex items-end p-5" style={{'--a':'#6b4a14'}}><span className="rounded-full bg-ink/70 px-3 py-1 text-xs text-bone/70">Photo placeholder: rooftop seating</span></div></Reveal>
    <Reveal className="space-y-6">
      <div className="grid grid-cols-2 gap-4">{[[Sun,'Open-air rooftop'],[Beer,'Craft beer'],[Martini,'Cocktails'],[Music,'Music']].map(([Ic,t])=><div key={t} className="flex items-center gap-3 rounded-2xl bg-char p-4 transition hover:bg-slate2"><Ic size={20} className="text-gold"/><span className="text-sm">{t}</span></div>)}</div>
      <Rating/>
      <p className="text-xs text-bone/50">Rating from public Google listing. <Ph>[PLACEHOLDER: confirm count before launch]</Ph></p>
    </Reveal></div></Section>)}

function Menu_(){
  const tabs=Object.keys(MENU);const [t,setT]=useState(tabs[0]);
  return(<Section id="menu" alt title="Food & Drinks" intro="Prices and descriptions below are placeholders until the current menu is supplied.">
    <div role="tablist" aria-label="Menu categories" className="mb-8 flex flex-wrap gap-2">{tabs.map(k=><button key={k} role="tab" id={'tab-'+k} aria-selected={t===k} aria-controls="menu-panel" onClick={()=>setT(k)} className={'rounded-full px-5 py-2 text-sm transition '+(t===k?'bg-gold text-ink':'border border-white/15 text-bone/80 hover:border-gold/60')}>{k}</button>)}</div>
    <ul id="menu-panel" role="tabpanel" aria-labelledby={'tab-'+t} className="grid gap-x-12 gap-y-7 md:grid-cols-2">{MENU[t].map(([n,d,p],i)=><li key={t+i} className="border-b border-white/10 pb-5"><div className="flex items-baseline gap-3"><h3 className="font-display text-xl">{n}</h3><span className="flex-1 border-b border-dotted border-white/20" aria-hidden="true"/><span className="text-gold">{p}</span></div><p className="mt-1 text-sm text-bone/60">{d}</p></li>)}</ul>
  </Section>)}

const List=({items})=>(<ul className="grid gap-5 sm:grid-cols-2">{items.map(([n,d,p],i)=><li key={i} className="rounded-2xl border border-white/10 bg-char p-6 transition duration-300 hover:border-gold/50"><div className="flex items-start justify-between gap-4"><h3 className="font-display text-xl">{n}</h3><span className="text-gold">{p}</span></div><p className="mt-2 text-sm text-bone/60">{d}</p></li>)}</ul>);
const Beer_=()=><Section id="beer" title="Craft beer" intro="Reviewers recommend the beer list. The live tap list goes here."><List items={BEERS}/></Section>;
const Cocktails=()=>(<Section id="cocktails" alt title="Signature cocktails" intro="Add the house cocktails with ingredients and prices.">
  <ul className="grid gap-6 md:grid-cols-3">{COCKTAILS.map(([n,d,p,c],i)=><li key={i} className="group overflow-hidden rounded-3xl border border-white/10"><div className="ph h-48 transition duration-700 group-hover:scale-105" style={{'--a':c}}/><div className="relative bg-ink p-6"><div className="flex justify-between gap-3"><h3 className="font-display text-xl">{n}</h3><span className="text-gold">{p}</span></div><p className="mt-2 text-sm text-bone/60">{d}</p></div></li>)}</ul></Section>);

function Gallery(){
  const [i,setI]=useState(null);const close=()=>setI(null);
  const go=(d)=>setI((i+d+GALLERY.length)%GALLERY.length);
  useEffect(()=>{if(i===null)return;const k=(e)=>{if(e.key==='Escape')close();if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)};window.addEventListener('keydown',k);document.body.style.overflow='hidden';return()=>{window.removeEventListener('keydown',k);document.body.style.overflow=''}});
  return(<Section id="gallery" title="Gallery" intro="Replace these tiles with real photography of the rooftop, views, bar and food.">
    <ul className="grid auto-rows-[160px] grid-cols-2 gap-3 sm:auto-rows-[200px] sm:grid-cols-4">{GALLERY.map(([t,c,s],k)=><li key={k} className={'col-span-1 '+s}><button onClick={()=>setI(k)} aria-label={'Open image: '+t} className="ph group relative h-full w-full overflow-hidden rounded-2xl border border-white/10 text-left transition duration-500 hover:border-gold/60" style={{'--a':c}}><span className="absolute inset-0 bg-ink/0 transition group-hover:bg-ink/30"/><span className="absolute bottom-3 left-3 text-sm">{t}</span><Maximize2 size={16} className="absolute right-3 top-3 text-gold opacity-0 transition group-hover:opacity-100"/></button></li>)}</ul>
    {i!==null&&<div role="dialog" aria-modal="true" aria-label="Image viewer" className="fixed inset-0 z-[70] flex items-center justify-center bg-ink/95 p-4" onClick={close}>
      <div className="ph relative aspect-[4/3] w-full max-w-3xl rounded-3xl border border-gold/20 flex items-end p-6" style={{'--a':GALLERY[i][1]}} onClick={e=>e.stopPropagation()}><p>{GALLERY[i][0]}<span className="block text-xs text-bone/50">Photo placeholder</span></p></div>
      <button autoFocus aria-label="Close" onClick={close} className="absolute right-4 top-4 rounded-full bg-slate2 p-3"><X size={20}/></button>
      <button aria-label="Previous image" onClick={e=>{e.stopPropagation();go(-1)}} className="absolute left-3 rounded-full bg-slate2 p-3"><ChevronLeft size={22}/></button>
      <button aria-label="Next image" onClick={e=>{e.stopPropagation();go(1)}} className="absolute right-3 rounded-full bg-slate2 p-3"><ChevronRight size={22}/></button></div>}
  </Section>)}

const Experiences=()=>(<Section id="experiences" alt title="Ways to spend an evening"><ul className="grid gap-5 sm:grid-cols-2 lg:grid-cols-4">{EXPS.map(([Ic,t,d])=><li key={t} className="rounded-2xl border border-white/10 bg-ink p-6 transition duration-300 hover:-translate-y-1 hover:border-gold/50"><Ic size={26} className="text-gold"/><h3 className="mt-5 font-display text-xl">{t}</h3><p className="mt-2 text-sm text-bone/60">{d}</p></li>)}</ul></Section>);

function Reviews(){
  const [n,setN]=useState(0);
  return(<Section id="reviews" title="What guests say" intro="Testimonials are placeholders. Add real reviews with the guest’s permission.">
    <div className="grid items-center gap-10 md:grid-cols-[1fr_2fr]"><Rating/>
      <figure className="relative rounded-3xl bg-char p-8"><Quote size={28} className="text-gold/60"/><blockquote className="mt-4 font-display text-xl font-light leading-relaxed sm:text-2xl" aria-live="polite">{REVIEWS[n][0]}</blockquote><figcaption className="mt-4 text-sm text-bone/60">{REVIEWS[n][1]}</figcaption>
        <div className="mt-6 flex gap-2" role="group" aria-label="Choose testimonial">{REVIEWS.map((_,k)=><button key={k} onClick={()=>setN(k)} aria-label={'Testimonial '+(k+1)} aria-current={n===k} className={'h-2 rounded-full transition-all '+(n===k?'w-8 bg-gold':'w-2 bg-white/25')}/>)}</div></figure></div></Section>)}

function Reserve(){
  const [done,setDone]=useState(null);const today=new Date().toISOString().slice(0,10);
  const onSubmit=(e)=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    /* TODO: POST to your booking endpoint or reservation provider here */
    setDone(d)};
  const f='w-full rounded-xl border border-white/15 bg-ink px-4 py-3 text-bone placeholder:text-bone/40 transition focus:border-gold';
  const L=({id,label,Ic,children})=><div><label htmlFor={id} className="mb-2 flex items-center gap-2 text-sm text-bone/80">{Ic&&<Ic size={15} className="text-gold"/>}{label}</label>{children}</div>;
  return(<section id="reserve" aria-labelledby="reserve-h" className="relative overflow-hidden bg-char py-20 sm:py-28"><div className="glow absolute -right-40 top-0 h-96 w-96 rounded-full" style={{background:'radial-gradient(circle,rgba(217,138,43,.22),transparent 70%)'}} aria-hidden="true"/>
    <div className="relative mx-auto grid max-w-6xl gap-12 px-5 sm:px-8 lg:grid-cols-2">
      <Reveal><h2 id="reserve-h" className="font-display text-4xl font-light sm:text-5xl">Reserve a table</h2><p className="mt-4 max-w-md text-bone/70">Pick a date, time and party size. We’ll confirm by phone or email. <Ph>[PLACEHOLDER: confirmation method and policy]</Ph></p>
        <p className="mt-6 text-sm text-bone/60">Hours: {BIZ.hours.map(h=>h.join(', ')).join('; ')}.</p></Reveal>
      <Reveal>{done?<div role="status" className="rounded-3xl border border-gold/40 bg-ink p-8"><Check className="text-gold" size={28}/><h3 className="mt-4 font-display text-2xl">Request received</h3><p className="mt-2 text-bone/70">{done.name}, we have your request for {done.guests} on {done.date} at {done.time}. This demo form is not connected to a booking system yet.</p><button onClick={()=>setDone(null)} className="mt-5 text-sm text-gold underline">Make another request</button></div>
      :<form onSubmit={onSubmit} className="grid gap-5 rounded-3xl border border-white/10 bg-ink p-6 sm:grid-cols-2 sm:p-8">
        <L id="date" label="Date" Ic={Calendar}><input id="date" name="date" type="date" min={today} required className={f}/></L>
        <L id="time" label="Time" Ic={Clock}><input id="time" name="time" type="time" required className={f}/></L>
        <L id="guests" label="Guests" Ic={Users}><select id="guests" name="guests" required className={f} defaultValue="2">{[1,2,3,4,5,6,7,8].map(n=><option key={n} value={n}>{n}</option>)}<option value="9+">9 or more</option></select></L>
        <L id="name" label="Full name"><input id="name" name="name" autoComplete="name" required className={f} placeholder="Your name"/></L>
        <L id="phone" label="Phone" Ic={Phone}><input id="phone" name="phone" type="tel" autoComplete="tel" required className={f} placeholder="Mobile number"/></L>
        <L id="email" label="Email" Ic={Mail}><input id="email" name="email" type="email" autoComplete="email" className={f} placeholder="Optional"/></L>
        <div className="sm:col-span-2"><L id="notes" label="Special requests"><textarea id="notes" name="notes" rows="3" className={f} placeholder="Occasion, seating preference, allergies"/></L></div>
        <button type="submit" className="sm:col-span-2 rounded-full bg-gold px-7 py-3.5 font-medium text-ink transition hover:bg-amber2 hover:shadow-[0_0_30px_rgba(217,138,43,.35)]">Request reservation</button></form>}</Reveal></div></section>)}

function Contact(){
  const q=encodeURIComponent(BIZ.mapQ);
  const rows=[[MapPin,'Address',BIZ.address+', '+BIZ.pincode],[Phone,'Phone',BIZ.phone],[Mail,'Email',BIZ.email]];
  return(<Section id="contact" title="Find us" intro="Look for the Power Plaza building on Lane 7. We’re on the rooftop, above Soy Como Soy.">
    <div className="grid gap-8 lg:grid-cols-2">
      <Reveal className="space-y-6">
        {rows.map(([Ic,l,v])=><div key={l} className="flex gap-4"><Ic size={20} className="mt-1 shrink-0 text-gold"/><div><h3 className="text-sm text-bone/60">{l}</h3><p className={v.includes('PLACEHOLDER')?'text-gold/80':''}>{v}</p></div></div>)}
        <div className="flex gap-4"><Clock size={20} className="mt-1 shrink-0 text-gold"/><div><h3 className="text-sm text-bone/60">Opening hours</h3><dl className="mt-1 space-y-1">{BIZ.hours.map(([d,h])=><div key={d} className="flex gap-6"><dt className="w-44 text-bone/80">{d}</dt><dd>{h}</dd></div>)}</dl><p className="mt-2 text-xs text-gold/80">[PLACEHOLDER: confirm hours and holiday timings]</p></div></div>
        <div className="flex flex-wrap gap-3 pt-2"><Btn href={'https://www.google.com/maps/dir/?api=1&destination='+q} target="_blank" rel="noopener noreferrer"><Navigation size={16}/>Get directions</Btn>
          <a href={BIZ.instagram} aria-label="Instagram" className="rounded-full border border-gold/40 p-3.5 transition hover:bg-gold/10"><Instagram size={18}/></a><a href={BIZ.facebook} aria-label="Facebook" className="rounded-full border border-gold/40 p-3.5 transition hover:bg-gold/10"><Facebook size={18}/></a></div>
        <p className="text-xs text-gold/80">[PLACEHOLDER: official social profile links]</p></Reveal>
      <Reveal><iframe title="Map showing BNTR Taproof in Koregaon Park, Pune" loading="lazy" referrerPolicy="no-referrer-when-downgrade" src={'https://www.google.com/maps?q='+q+'&output=embed'} className="h-80 w-full rounded-3xl border border-white/10 lg:h-full lg:min-h-[420px]" style={{filter:'grayscale(.6) invert(.9) hue-rotate(180deg) contrast(.9)'}}/></Reveal></div></Section>)}

const Footer=()=>(<footer className="border-t border-white/10 bg-ink py-10 text-center text-sm text-bone/50"><p className="font-display text-lg text-bone">BNTR <span className="text-gold">Taproof</span></p><p className="mt-2">{BIZ.address}</p><p className="mt-4">Please drink responsibly. <Ph>[PLACEHOLDER: licence and legal notices]</Ph></p></footer>);

function App(){
  useEffect(()=>{const ld={"@context":"https://schema.org","@type":"BarOrPub",name:BIZ.name,address:{"@type":"PostalAddress",streetAddress:"Power Plaza Rooftop, Lane 7, Koregaon Park",addressLocality:"Pune",addressRegion:"Maharashtra",addressCountry:"IN"},servesCuisine:"Bar food",openingHoursSpecification:[{"@type":"OpeningHoursSpecification",dayOfWeek:["Monday","Tuesday","Wednesday","Thursday"],opens:"15:00",closes:"24:00"},{"@type":"OpeningHoursSpecification",dayOfWeek:["Friday","Saturday","Sunday"],opens:"12:00",closes:"24:00"}]};
    const s=document.createElement('script');s.type='application/ld+json';s.text=JSON.stringify(ld);document.head.appendChild(s)},[]);
  return(<><a href="#about" className="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[80] focus:rounded focus:bg-gold focus:px-4 focus:py-2 focus:text-ink">Skip to content</a>
    <Header/><main><Hero/><About/><Menu_/><Beer_/><Cocktails/><Gallery/><Experiences/><Reviews/><Reserve/><Contact/></main><Footer/></>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
